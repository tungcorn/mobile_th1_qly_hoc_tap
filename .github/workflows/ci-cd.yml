name: CI/CD Pipeline - StudyDoc Manager

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI - Kiểm tra chất lượng mã nguồn (Quality Gate: Analyze & Test)
  # =========================================================================
  quality-gate:
    name: Kiểm tra chất lượng (Analyze & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Thiết lập môi trường Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cài đặt thư viện dependencies
        run: flutter pub get

      - name: Phân tích cú pháp tĩnh (flutter analyze)
        run: flutter analyze

      - name: Chạy kiểm thử tự động (flutter test)
        run: flutter test --reporter expanded

  # =========================================================================
  # 2. Build - Biên dịch và đóng gói ứng dụng (Android APK & Web Bundle)
  # =========================================================================
  build-packages:
    name: Biên dịch và đóng gói (Android APK & Web)
    needs: quality-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cài đặt thư viện dependencies
        run: flutter pub get

      - name: Biên dịch bản dựng Android Release APK
        run: flutter build apk --release

      - name: Biên dịch bản dựng Web Release
        run: flutter build web --release

      - name: Nén gói Web thành tệp ZIP
        run: |
          cd build/web
          zip -r ../../web-build.zip .
          cd ../..

      - name: Lưu trữ artifact Android APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Lưu trữ artifact Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build-zip
          path: web-build.zip
          retention-days: 7

  # =========================================================================
  # 3. CD - Tự động phát hành phiên bản (Continuous Delivery & Release)
  # =========================================================================
  deploy-release:
    name: Tự động phát hành (Continuous Delivery)
    needs: build-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tải về artifact Android APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: .

      - name: Tải về artifact Web
        uses: actions/download-artifact@v4
        with:
          name: web-build-zip
          path: .

      - name: Khởi tạo thông tin phát hành tiếng Việt và Changelog
        id: release_info
        run: |
          # 1. Xác định thời gian phát hành theo giờ Việt Nam (GMT+7)
          VN_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%d/%m/%Y %H:%M:%S (GMT+7)')
          TAG_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%Y.%m.%d-%H%M')
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="v${TAG_TIME}-${SHORT_SHA}"

          echo "VN_TIME=${VN_TIME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

          # 2. Trích xuất danh sách các thay đổi (Changelog)
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.event.after }}"

          echo "### Danh sách các thay đổi trong phiên bản này (Changelog)" > changelog.md
          echo "" >> changelog.md

          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            CHANGES=$(git log --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s *(tác giả: %an)*" "${BEFORE_SHA}..${AFTER_SHA}")
          else
            CHANGES=$(git log -n 5 --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s *(tác giả: %an)*")
          fi

          if [ -z "$CHANGES" ]; then
            CHANGES="- Cập nhật mã nguồn hệ thống trên nhánh \`${{ github.ref_name }}\`."
          fi

          echo "$CHANGES" >> changelog.md
          echo "" >> changelog.md

          # 3. Tạo toàn bộ nội dung Release Notes bằng tiếng Việt
          echo "# Bản Phát Hành Tự Động (Continuous Delivery) - StudyDoc Manager" > release_notes_header.md
          echo "" >> release_notes_header.md
          echo "## Thông tin triển khai" >> release_notes_header.md
          echo "- **Ngày giờ tạo**: \`${VN_TIME}\`" >> release_notes_header.md
          echo "- **Nhánh triển khai**: \`${{ github.ref_name }}\`" >> release_notes_header.md
          echo "- **Mã commit**: [\`${SHORT_SHA}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> release_notes_header.md
          echo "- **Người kích hoạt**: @${{ github.actor }}" >> release_notes_header.md
          echo "- **Trạng thái quy trình**: Hoàn tất thành công (100% Passed)" >> release_notes_header.md
          echo "" >> release_notes_header.md
          echo "---" >> release_notes_header.md
          echo "" >> release_notes_header.md

          echo "## Báo cáo kiểm định chất lượng (Quality Gates)" > release_notes_footer.md
          echo "- **Phân tích cú pháp tĩnh (\`flutter analyze\`)**: ĐẠT (0 lỗi, 0 cảnh báo nghiêm trọng)." >> release_notes_footer.md
          echo "- **Bộ kiểm thử tự động (\`flutter test\`)**: ĐẠT 100% (29/29 ca kiểm thử vượt qua)." >> release_notes_footer.md
          echo "- **Bản dựng Android APK**: Biên dịch thành công (Release mode)." >> release_notes_footer.md
          echo "- **Bản dựng Web**: Đóng gói hoàn tất (Release bundle)." >> release_notes_footer.md
          echo "" >> release_notes_footer.md
          echo "---" >> release_notes_footer.md
          echo "" >> release_notes_footer.md
          echo "## Tệp đính kèm phân phối (Release Assets)" >> release_notes_footer.md
          echo "| Tệp đính kèm | Định dạng | Mục đích sử dụng |" >> release_notes_footer.md
          echo "|---|---|---|" >> release_notes_footer.md
          echo "| \`app-release.apk\` | Android Application Package | Cài đặt trực tiếp trên điện thoại hoặc máy ảo Android |" >> release_notes_footer.md
          echo "| \`web-build.zip\` | Web Archive Bundle | Triển khai trên máy chủ Web lưu trữ tĩnh (Static Hosting) |" >> release_notes_footer.md
          echo "" >> release_notes_footer.md
          echo "---" >> release_notes_footer.md
          echo "*Bản phát hành được tự động biên dịch, kiểm thử và phát hành bởi GitHub Actions CI/CD Pipeline.*" >> release_notes_footer.md

          cat release_notes_header.md changelog.md release_notes_footer.md > full_release_notes.md

      - name: Tạo GitHub Release và đính kèm tệp sản phẩm
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Bản phát hành tự động [${{ env.VN_TIME }}]"
          body_path: full_release_notes.md
          files: |
            app-release.apk
            web-build.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
